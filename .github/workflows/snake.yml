name: Generate Snake (Blue Theme)

on:
  schedule:
    - cron: "0 */6 * * *" # se actualiza cada 6 horas
  workflow_dispatch: {} # te permite ejecutarlo manualmente desde la pestaña "Actions"
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generar la animación con paleta azul
        uses: Platane/snk@v3
        with:
          github_user_name: Maax9o9
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark-blue&color_snake=58a6ff,1f6feb,0d1117

      - name: Publicar en la rama "output"
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
